<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dohra</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="pop-head">
      <span class="brand"><span class="logo"></span>Dohra</span>
      <nav>
        <a href="#" id="open-library" class="icon-link" title="Library" aria-label="Library"><i data-icon="library"></i></a>
        <a href="#" id="open-settings" class="icon-link" title="Settings" aria-label="Settings"><i data-icon="settings"></i></a>
      </nav>
    </header>

    <p id="error" class="banner error" hidden></p>
    <p id="update" class="banner info" hidden><span id="update-text"></span> <a href="#" id="open-update">Update in Settings</a></p>

    <section id="idle" hidden>
      <div class="panel">
        <label class="field">
          <span>Recording title</span>
          <input id="title" type="text" maxlength="120" placeholder="e.g. DSA class — graphs" />
        </label>
        <div id="summary" class="chips" aria-label="What is recorded"></div>
      </div>

      <div class="options">
        <label class="switch-row" id="mic-switch" hidden>
          <span><span class="label">Include my microphone</span></span>
          <input id="mic" type="checkbox" class="switch" />
        </label>
        <label class="switch-row">
          <span>
            <span class="label">Make a transcript</span>
            <span class="sub">Off: just record the audio and video</span>
          </span>
          <input id="transcribe" type="checkbox" class="switch" />
        </label>
        <label class="switch-row">
          <span>
            <span class="label">Save a copy to Downloads</span>
            <span class="sub">Everything also goes to Downloads/Dohra</span>
          </span>
          <input id="auto-export" type="checkbox" class="switch" />
        </label>
      </div>

      <p id="space-help" class="banner warn" hidden>
        <span id="space-text"></span> <a href="#" id="open-space">Free up space</a>
      </p>

      <p id="mic-help" class="banner warn" hidden>
        Dohra records your microphone too, and needs permission once.
        <a href="#" id="allow-mic">Allow microphone</a>
      </p>

      <button id="start" class="primary big start"><span class="rec-dot"></span>Start recording</button>
      <p id="companion" class="status-dot"></p>
      <p class="shortcut">Start or stop anywhere with <kbd>Alt</kbd> <kbd>Shift</kbd> <kbd>R</kbd></p>
    </section>

    <section id="recording" hidden>
      <div class="live">
        <div class="live-head">
          <span id="rec-status" class="rec-status"></span>
          <span id="size" class="size"></span>
        </div>
        <p id="timer" class="timer">00:00</p>
        <p id="rec-title" class="rec-title"></p>
      </div>

      <div id="transcript-box" class="transcript-box" hidden>
        <div class="transcript-head">
          <span><i data-icon="text"></i> Transcript</span>
          <span id="transcript-status"></span>
        </div>
        <progress id="transcript-progress" max="1" value="0"></progress>
      </div>

      <div id="mic-box" class="mic-box" hidden>
        <p id="mic-text" class="status-dot"></p>
        <button id="mic-toggle" class="small"></button>
      </div>

      <div class="controls">
        <button id="pause"></button>
        <button id="stop" class="danger"></button>
      </div>
      <button id="bookmark" class="bookmark" title="Alt+Shift+B, from any tab"></button>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
