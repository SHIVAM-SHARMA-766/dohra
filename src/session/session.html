<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dohra Session</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="session.css" />
  </head>
  <body>
    <header class="top">
      <a href="library.html" class="back">← Library</a>
      <span class="brand"><span class="dot"></span>Dohra</span>
    </header>

    <main>
      <p id="notice" class="banner warn" hidden></p>
      <h1 id="title"></h1>
      <p id="details" class="hint"></p>

      <div class="layout">
        <section class="player">
          <video id="media" controls preload="metadata"></video>
        </section>

        <section class="transcript" aria-label="Transcript">
          <div class="transcript-bar">
            <input id="search" type="text" placeholder="Search the transcript" aria-label="Search the transcript" />
            <div id="script" class="segmented small" role="radiogroup" aria-label="Script" hidden>
              <label><input type="radio" name="script" value="native" checked /><span>देवनागरी</span></label>
              <label><input type="radio" name="script" value="roman" /><span>Roman</span></label>
            </div>
            <label class="check small"><input id="follow" type="checkbox" checked /><span>Follow</span></label>
          </div>
          <p id="transcript-status" class="hint"></p>
          <div id="empty" class="empty" hidden>
            <p id="empty-text"></p>
            <button id="transcribe" class="primary" hidden>Transcribe this recording</button>
            <p class="hint"><a href="companion.html">Transcription companion setup</a></p>
          </div>
          <ol id="lines" class="lines"></ol>
          <div class="transcript-actions">
            <button id="download-txt" hidden>Download transcript (.txt)</button>
          </div>
        </section>
      </div>
    </main>

    <script src="session.js"></script>
  </body>
</html>
