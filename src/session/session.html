<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dohra Session</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="session.css" />
  </head>
  <body>
    <header class="appbar">
      <a href="library.html" class="brand"><span class="logo"></span>Dohra</a>
      <span class="spacer"></span>
      <nav>
        <a href="library.html" class="navlink"><i data-icon="library"></i><span class="label">Library</span></a>
        <a href="settings.html" class="navlink"><i data-icon="settings"></i><span class="label">Settings</span></a>
      </nav>
    </header>

    <main>
      <a href="library.html" class="back"><i data-icon="back"></i>All recordings</a>
      <p id="notice" class="banner warn" hidden></p>
      <h1 id="title"></h1>
      <p id="details" class="details"></p>

      <div class="layout">
        <section class="player">
          <video id="media" controls preload="metadata"></video>
          <div id="video-elsewhere" class="video-elsewhere card" hidden>
            <span class="section-icon big"><i data-icon="folder"></i></span>
            <p>To save space, this video is kept only in your Downloads folder:</p>
            <code id="video-path"></code>
            <button id="show-video" class="small"><i data-icon="folder"></i>Show in Downloads</button>
          </div>
          <div id="bookmarks" class="bookmarks card" hidden>
            <h3><i data-icon="bookmark"></i>Bookmarks</h3>
            <div id="bookmark-list" class="bookmark-list"></div>
          </div>
        </section>

        <section class="transcript card" aria-label="Transcript">
          <div class="transcript-bar">
            <div class="bar-title">
              <span class="section-icon"><i data-icon="text"></i></span>
              <div>
                <h2>Transcript</h2>
                <p id="transcript-status" class="status"></p>
              </div>
              <span id="transcript-percent" class="percent" hidden></span>
            </div>
            <progress id="transcript-progress" class="transcript-progress" max="1" value="0" hidden></progress>
            <div class="bar-tools">
              <label class="search">
                <i data-icon="search"></i>
                <input id="search" type="text" placeholder="Search the transcript" aria-label="Search the transcript" />
              </label>
              <div id="script" class="segmented" role="radiogroup" aria-label="Script" hidden>
                <label><input type="radio" name="script" value="native" checked /><span>देवनागरी</span></label>
                <label><input type="radio" name="script" value="roman" /><span>Roman</span></label>
              </div>
              <label class="follow"><input id="follow" type="checkbox" class="switch" checked /><span>Follow</span></label>
            </div>
          </div>
          <div id="empty" class="empty" hidden>
            <span class="section-icon big"><i data-icon="sparkles"></i></span>
            <p id="empty-text"></p>
            <button id="transcribe" class="primary" hidden>Transcribe this recording</button>
            <p class="hint"><a href="setup.html">Set up transcription</a></p>
          </div>
          <ol id="lines" class="lines"></ol>
          <div class="transcript-actions">
            <button id="download-txt" class="small" hidden><i data-icon="download"></i>Download .txt</button>
            <button id="download-srt" class="small" hidden title="Captions for VLC, mpv and most players">
              <i data-icon="download"></i>Subtitles .srt
            </button>
            <button id="download-vtt" class="small" hidden title="Captions for browsers and web players">
              <i data-icon="download"></i>Subtitles .vtt
            </button>
          </div>
        </section>
      </div>
    </main>

    <script src="session.js"></script>
  </body>
</html>
