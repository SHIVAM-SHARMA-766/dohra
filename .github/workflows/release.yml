name: Release

# Push a tag like v0.7.0 (matching package.json) to build the extension zip and the
# companion for each platform into a draft release; scripts/sign-release.sh then
# signs and publishes it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.mod
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Build the companion
        working-directory: companion
        run: |
          go test ./...
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
              -o "../release/dohra-companion-$os-$arch$ext" .
          done
          cd ../release && sha256sum dohra-* > SHA256SUMS
      # A draft: nobody downloads it, and installed copies do not see it, until the
      # maintainer signs SHA256SUMS on their own computer and publishes it
      # (scripts/sign-release.sh). The signing key never reaches GitHub.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft \
            --title "Dohra $GITHUB_REF_NAME" --generate-notes
