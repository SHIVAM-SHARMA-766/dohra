name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The end-to-end test needs Chromium, which (unlike branded Chrome) still loads
      # unpacked extensions. xvfb-run is preinstalled on ubuntu runners.
      - uses: browser-actions/setup-chrome@v1
        id: chromium
        with:
          chrome-version: latest
      # Recordings must also play in GStreamer, which desktop players on Linux use.
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gstreamer-1.0 gstreamer1.0-plugins-good
      - run: npm run e2e
        env:
          CHROME: ${{ steps.chromium.outputs.chrome-path }}
          REQUIRE_GSTREAMER: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: .e2e/downloads
          retention-days: 7
